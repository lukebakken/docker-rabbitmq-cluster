# Stable cluster name so federation internal-queue names
# ("federation: <ex> -> <cluster_name>:<vhost>:<ex>") do not rotate by node
# when a link migrates during a drain. Without this, cluster_name defaults to
# the node name and each migration strands a consumerless internal queue --
# a harness artifact, not the #11495 roster stranding. Mirrors the customer,
# whose cluster_name is a stable value.
cluster_name = repro-cluster
cluster_partition_handling = pause_minority
loopback_users = none
log.console = true
log.console.level = info
log.file.level = debug
log.exchange = false
log.exchange.level = info
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.0 = rabbit@rmq0
cluster_formation.classic_config.nodes.1 = rabbit@rmq1
cluster_formation.classic_config.nodes.2 = rabbit@rmq2
