networks:
  rabbitnet:
    name: rabbitnet
    driver: bridge

x-rmq-common: &common-config
  networks:
    - rabbitnet
  build: rmq
  mem_limit: 8gb
  ulimits:
    nofile:
      soft: 65536
      hard: 131072

services:
  rmq0:
    <<: *common-config
    hostname: rmq0
    volumes:
      - ./data/rmq0:/var/lib/rabbitmq/mnesia
      - ./log/rmq0:/var/log/rabbitmq
    ports:
      # HOST:CONTAINER
      - 8872:15672
      - 15692:15692
  rmq1:
    <<: *common-config
    hostname: rmq1
    volumes:
      - ./data/rmq1:/var/lib/rabbitmq/mnesia
      - ./log/rmq1:/var/log/rabbitmq
    ports:
      # HOST:CONTAINER
      - 8873:15672
      - 15693:15692
  rmq2:
    <<: *common-config
    hostname: rmq2
    volumes:
      - ./data/rmq2:/var/lib/rabbitmq/mnesia
      - ./log/rmq2:/var/log/rabbitmq
    ports:
      # HOST:CONTAINER
      - 8874:15672
      - 15694:15692
  # Declares cmq-repro from a connection to rmq0, so with the default client-local leader
  # locator the queue's leader is on rmq0 and its mirrors are on rmq1 and rmq2.
  publisher-noconfirm:
    image: pivotalrabbitmq/perf-test:latest
    networks:
      - rabbitnet
    command:
      - --uri=amqp://rmq0
      - --servers-startup-timeout=60
      - --id=noconfirm
      - --producers=1
      - --consumers=0
      - --rate=200
      - --size=16384
      - --flag=persistent
      - --queue=cmq-repro
      - --auto-delete=false
    depends_on:
      - rmq0
      - rmq1
      - rmq2
    restart: on-failure
  # Consumes more slowly than the publisher publishes, so cmq-repro stays at its max-length
  # and the leader keeps rejecting publishes.
  consumer:
    image: pivotalrabbitmq/perf-test:latest
    networks:
      - rabbitnet
    command:
      - --uri=amqp://rmq0
      - --servers-startup-timeout=60
      - --id=consumer
      - --producers=0
      - --consumers=1
      - --consumer-rate=100
      - --queue=cmq-repro
      - --auto-delete=false
    depends_on:
      - rmq0
      - rmq1
      - rmq2
    restart: on-failure
  # Control: the same load with publisher confirms. Start with `--profile confirm`.
  publisher-confirm:
    image: pivotalrabbitmq/perf-test:latest
    profiles:
      - confirm
    networks:
      - rabbitnet
    command:
      - --uri=amqp://rmq0
      - --servers-startup-timeout=60
      - --id=confirm
      - --producers=1
      - --consumers=0
      - --rate=200
      - --size=16384
      - --flag=persistent
      - --confirm=32
      - --queue=cmq-repro
      - --auto-delete=false
    depends_on:
      - rmq0
      - rmq1
      - rmq2
    restart: on-failure
  haproxy:
    image: haproxy:latest
    networks:
      - rabbitnet
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - rmq0
      - rmq1
      - rmq2
    ports:
      # HOST:CONTAINER
      - 15672:15672
      - 5672:5672
      - 5552:5552
